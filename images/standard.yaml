targets:
  lxc:
    create_message: |-
      You just created an {{ image.description }} container.
    config:
    - type: all
      before: 5
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/centos.common.conf
    - type: user
      before: 5
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/centos.userns.conf
    - type: all
      after: 4
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/common.conf
    - type: user
      after: 4
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
    - type: all
      content: |-
        lxc.arch = {{ image.architecture_kernel }}
  incus:
    vm:
      # The image contains only an EFI partition and a root partition.
      size: 214748364800
      filesystem: ext4

files:
- path: /var/lib/distrobuilder/tyy-kernel-6.1.0-2.3.x86_64.tar.bz2
  generator: copy
  source: /var/tmp/tyy-kernel-6.1.0-2.3.x86_64.tar.bz2
  mode: "0644"

- path: /etc/hostname
  generator: hostname

- path: /etc/hosts
  generator: hosts

- path: /etc/machine-id
  generator: dump
  content: uninitialized

- path: /etc/fstab
  generator: dump

- path: /var/lib/dbus/machine-id
  generator: remove

- path: /etc/sysconfig/network
  generator: template
  content: |-
    NETWORKING=yes
    HOSTNAME={{ container.name }}

- path: /etc/sysconfig/network-scripts/ifcfg-eth0
  generator: template
  content: |-
    DEVICE=eth0
    NAME=eth0
    BOOTPROTO=dhcp
    ONBOOT=yes
    HOSTNAME={{ container.name }}
    TYPE=Ethernet
    MTU=
    DHCP_HOSTNAME={{ container.name }}
  types:
  - vm

- path: /etc/default/grub
  generator: dump
  content: |-
    GRUB_DEFAULT=saved
    GRUB_RECORDFAIL_TIMEOUT=0
    GRUB_TIMEOUT=0
    GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} console=tty1 console=ttyS0 net.ifnames=0 biosdevname=0"
    GRUB_TERMINAL=console
    GRUB_DISABLE_OS_PROBER=true
  types:
  - vm

- path: /etc/dracut.conf.d/incus.conf
  generator: dump
  content: |-
    add_drivers+=" virtio_scsi virtio_console "
  types:
  - vm

- generator: fstab
  types:
  - vm

- path: /etc/systemd/system/incus-agent-workaround.service
  generator: dump
  content: |-
    [Unit]
    Description=Incus - agent (CentOS 7 workaround)
    Before=incus-agent.service

    [Service]
    Type=oneshot
    ExecStart=-/bin/mkdir /run/incus_agent

    [Install]
    WantedBy=multi-user.target
  types:
  - vm

- path: /etc/systemd/system/incus-agent.service.d/incus.conf
  generator: dump
  content: |-
    [Service]
    WorkingDirectory=/run/incus_agent
  types:
  - vm

- generator: incus-agent
  types:
  - vm

packages:
  manager: yum
  update: true
  cleanup: true
  sets:
  - packages:
    - cronie
    - bzip2
    - curl
    - dmidecode
    - epel-release
    - hostname
    - initscripts
    - ipmitool
    - iproute
    - jq
    - openssh-clients
    - passwd
    - pciutils
    - policycoreutils
    - rootfiles
    - sudo
    - rsyslog
    - vim-minimal
    action: install

  - packages:
    - dhclient
    action: install

  - packages:
    - cronie-noanacron
    action: install

  - packages:
    - NetworkManager
    - shim
    - irqbalance
    - grub2-efi-x64
    - grubby
    action: install
    types:
    - vm

  - packages:
    - containerd.io
    - docker-buildx-plugin
    - docker-ce
    - docker-ce-cli
    - docker-compose-plugin
    action: install
    types:
    - vm

actions:
- trigger: post-unpack
  action: |-
    #!/bin/sh

    __main() {
      set -eux

      _docker_key=/etc/pki/rpm-gpg/RPM-GPG-KEY-Docker
      _docker_key_sha256=e6c650e0700b1bf4868b693b30761b926844befc8a0acb7ac0dd9b1faf1b7423

      touch /etc/hosts /etc/hostname

      # Keep the build on the official Vault. The final image switches to the
      # mainland mirror pool in the post-files action below.
      cat > /etc/yum.repos.d/CentOS-Base.repo <<'EOF'
    [base]
    name=CentOS 7.9.2009 - Base
    baseurl=https://vault.centos.org/7.9.2009/os/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial

    [updates]
    name=CentOS 7.9.2009 - Updates
    baseurl=https://vault.centos.org/7.9.2009/updates/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial

    [extras]
    name=CentOS 7.9.2009 - Extras
    baseurl=https://vault.centos.org/7.9.2009/extras/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial
    EOF

      # jq is supplied by EPEL 7. The retired EPEL metalink resolves to its
      # archive, while Docker's CentOS 7 repository supplies its final releases.
      yum -y install ca-certificates curl epel-release
      curl -fsSL --retry 3 --retry-delay 2 \
        -o "${_docker_key}" \
        https://download.docker.com/linux/centos/gpg
      printf '%s  %s\n' "${_docker_key_sha256}" "${_docker_key}" \
        | sha256sum --check --strict
      rpm --import "${_docker_key}"

      cat > /etc/yum.repos.d/docker-ce.repo <<'EOF'
    [docker-ce-stable]
    name=Docker CE Stable - $basearch
    baseurl=https://download.docker.com/linux/centos/7/$basearch/stable
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Docker
    EOF
    }

    __main "$@"

- trigger: post-packages
  action: |-
    #!/bin/sh

    __main() {
      set -eux

      mkdir -p /selinux
      echo 0 > /selinux/enforce
      sed -i '/^session.*pam_loginuid.so/s/^session/# session/' /etc/pam.d/*
    }

    __main "$@"

- trigger: post-files
  action: |-
    #!/bin/sh

    __prepare_machine_id() {
      : > /etc/machine-id
      rm -f /var/lib/dbus/machine-id
      systemd-machine-id-setup
      test -s /etc/machine-id
    }

    __reset_machine_id() {
      printf 'uninitialized\n' > /etc/machine-id
      rm -f /var/lib/dbus/machine-id
    }

    __install_tyy_kernel() {
      _kernel_archive=kernel-6.1.0-2.3.x86_64.tar.bz2
      _kernel_archive_sha256=9e7cff72a92b96ddf52315015f3e04333c6324285a2145f50a8377cf267c8f6d
      _kernel_package=kernel-6.1.0-2.3.ctl3.x86_64.rpm
      _kernel_package_sha256=71efae39206f2eaa1c2b14bcfe392844392e35ce0b705cf3967c5be4327d40d3
      _kernel_dir=/tmp/tyy-kernel
      _staged_archive=/var/lib/distrobuilder/tyy-kernel-6.1.0-2.3.x86_64.tar.bz2
      _epel_key=/etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-7

      mkdir -p "${_kernel_dir}"
      if [ ! -s "${_epel_key}" ]; then
        curl -fsSL --retry 3 --retry-delay 2 \
          -o "${_epel_key}" \
          https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-7
      fi
      rpm --import "${_epel_key}"
      yum clean all
      cp -- "${_staged_archive}" "${_kernel_dir}/${_kernel_archive}"

      (
        cd "${_kernel_dir}"
        printf '%s  %s\n' "${_kernel_archive_sha256}" "${_kernel_archive}" \
          | sha256sum --check --strict
        tar -xjf "${_kernel_archive}"
        test -f "kernel_install_610_23_local_lcdn/${_kernel_package}"
        printf '%s  %s\n' "${_kernel_package_sha256}" \
          "kernel_install_610_23_local_lcdn/${_kernel_package}" \
          | sha256sum --check --strict
      )

      # The kernel artifact is unsigned; the pinned archive and RPM digests provide
      # reproducibility while rpm installs the package's own kernel scriptlets.
      rpm -ivh --force \
        "${_kernel_dir}/kernel_install_610_23_local_lcdn/${_kernel_package}"
      rpm -q kernel-6.1.0-2.3.ctl3.x86_64

      yum clean all
      rm -rf "${_kernel_dir}"
      rm -f "${_staged_archive}"
    }

    __cleanup_firmware_mount() {
      if mountpoint -q /sys/firmware; then
        umount /sys/firmware
      fi
    }

    __configure_boot() {
      _kernel_version=6.1.0-2.3.ctl3.x86_64

      test -f "/boot/vmlinuz-${_kernel_version}"
      depmod -a "${_kernel_version}"
      dracut --kver "${_kernel_version}" --force

      trap __cleanup_firmware_mount EXIT HUP INT TERM
      mount -t tmpfs tmpfs /sys/firmware
      mkdir -p /sys/firmware/efi

      _grub_target="$(readlink -f /etc/grub2-efi.cfg)"
      grub2-mkconfig -o "${_grub_target}"
      sed -i "s#root=[^ ]*#root=${DISTROBUILDER_ROOT_UUID}#g" "${_grub_target}"
      grubby --set-default "/boot/vmlinuz-${_kernel_version}"

      _default_kernel="$(grubby --default-kernel)"
      test "${_default_kernel}" = "/boot/vmlinuz-${_kernel_version}"

      umount /sys/firmware
      trap - EXIT HUP INT TERM
    }

    __configure_runtime_repositories() {
      mkdir -p /etc/yum.repos.d/disabled
      find /etc/yum.repos.d -maxdepth 1 -type f -name '*.repo' \
        -exec mv -t /etc/yum.repos.d/disabled -- {} +
      cat > /etc/yum.repos.d/CentOS-Base.repo <<'EOF'
    [base]
    name=CentOS 7.9.2009 - Base - Mainland China
    baseurl=https://mirrors.cloud.tencent.com/centos-vault/7.9.2009/os/$basearch/
            https://mirrors.aliyun.com/centos-vault/7.9.2009/os/$basearch/
            https://mirrors.huaweicloud.com/centos-vault/7.9.2009/os/$basearch/
            https://mirrors.nju.edu.cn/centos-vault/7.9.2009/os/$basearch/
            https://mirrors.hit.edu.cn/centos-vault/7.9.2009/os/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial
    failovermethod=priority

    [updates]
    name=CentOS 7.9.2009 - Updates - Mainland China
    baseurl=https://mirrors.cloud.tencent.com/centos-vault/7.9.2009/updates/$basearch/
            https://mirrors.aliyun.com/centos-vault/7.9.2009/updates/$basearch/
            https://mirrors.huaweicloud.com/centos-vault/7.9.2009/updates/$basearch/
            https://mirrors.nju.edu.cn/centos-vault/7.9.2009/updates/$basearch/
            https://mirrors.hit.edu.cn/centos-vault/7.9.2009/updates/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial
    failovermethod=priority

    [extras]
    name=CentOS 7.9.2009 - Extras - Mainland China
    baseurl=https://mirrors.cloud.tencent.com/centos-vault/7.9.2009/extras/$basearch/
            https://mirrors.aliyun.com/centos-vault/7.9.2009/extras/$basearch/
            https://mirrors.huaweicloud.com/centos-vault/7.9.2009/extras/$basearch/
            https://mirrors.nju.edu.cn/centos-vault/7.9.2009/extras/$basearch/
            https://mirrors.hit.edu.cn/centos-vault/7.9.2009/extras/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial
    failovermethod=priority
    EOF
      yum clean all
    }

    __main() {
      set -eux

      # Kernel RPM scriptlets require a valid ID; guests must generate their own.
      __prepare_machine_id
      __install_tyy_kernel
      __configure_boot
      __configure_runtime_repositories
      rpm -q containerd.io docker-buildx-plugin docker-ce docker-ce-cli \
        docker-compose-plugin jq dmidecode pciutils
      docker --version
      docker buildx version
      docker compose version
      mkdir -p /etc/selinux
      if [ -f /etc/selinux/config ]; then
        sed -i 's/^SELINUX=.*/SELINUX=disabled/' /etc/selinux/config
      else
        printf '%s\n' SELINUX=disabled SELINUXTYPE=targeted > /etc/selinux/config
      fi
      grep -qx 'SELINUX=disabled' /etc/selinux/config
      __reset_machine_id

      systemctl enable NetworkManager.service
      systemctl enable docker.service
      systemctl enable incus-agent-workaround.service
      rm -Rf /var/lib/selinux/*
      systemctl mask systemd-firstboot.service
    }

    __main "$@"
